<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Photo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/photos.js" defer></script>

</head>
<body>
    <div class="container">

        <h1>Galerie Photo</h1>

        <!-- Section errors -->
        <div id="errors" class="container alert alert-danger" role="alert">
        </div>

        <!-- Section authentication -->
        <div id="authentication" class="container"></div>

        <!-- Vignettes -->
        <div id="thumbnails" class="row">
        </div>

        <div class="row">
            <div class="col-md-8">

                <!-- Photo principale -->
                <div id="photo">
                    <p class="text-muted">Aucune photo sélectionnée</p>
                </div>

                <!-- Commentaires -->
                <div id="comments">
                    <p class="text-muted">Aucun commentaire</p>
                </div>

                <!-- Ajout de commentaire -->
                <div id="comments-add">
                    <form>
                        <div class="row g-2 align-items-center mb-2"></div>
                        <div class="row g-2 align-items-center mb-2"></div>
                        <div class="row g-2 align-items-center">
                            <div class="col">
                                <input type="text" class="form-control" placeholder="Ecrivez votre commentaire...">
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-outline-secondary">Envoyer</button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>

            <!-- Colonne chat -->
            <div class="col-md-4">
                <div id="chat">
                    <div id="chat-title">Chat</div>
                    <div id="chat-messages">
                    </div>
                    <form id="chat-form">
                        <div class="input-group">
                            <input type="text" id="chat-input" class="form-control" placeholder="Ecrivez votre message...">
                            <button type="submit" class="btn btn-outline-secondary">Envoyer</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
